<p>register-page works!</p>

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Pseudonyme : 
            </p-inputgroup-addon>
            <input pInputText formControlName="userName" placeholder="Username" />
        </p-inputgroup>
    </div>
        <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Prénom : 
            </p-inputgroup-addon>
            <input pInputText formControlName="firstName" placeholder="Prénom" />
        </p-inputgroup>
    </div>
        <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Nom de famille : 
            </p-inputgroup-addon>
            <input pInputText formControlName="lastName" placeholder="Nom" />
        </p-inputgroup>
    </div>
        <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Courrier électronique : 
            </p-inputgroup-addon>
            <input pInputText formControlName="email" placeholder="test@test.be" />
        </p-inputgroup>
    </div>
        <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Mot de passe : 
            </p-inputgroup-addon>
            <p-password pInputPassword [feedback]="false" autocomplete="off" formControlName="password" placeholder="***" />
        </p-inputgroup>
    </div>
        <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Date de naissance : 
            </p-inputgroup-addon>
            <p-date-picker dateFormat="d.m.yy"  formControlName="birthDate" />
        </p-inputgroup>
    </div>

            <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Nom de rue : 
            </p-inputgroup-addon>
            <input  formControlName="streetName" placeholder="Rue de machin" />
        </p-inputgroup>
    </div>
            <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Numéro de rue : 
            </p-inputgroup-addon>
            <input formControlName="streetNumber" placeholder="1" />
        </p-inputgroup>
    </div>
                <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Ville : 
            </p-inputgroup-addon>
            <input formControlName="city" placeholder="Ville" />
        </p-inputgroup>
    </div>
                <div>
        <p-inputgroup>
            <p-inputgroup-addon>
                Pays : 
            </p-inputgroup-addon>
            <input formControlName="country" placeholder="Pays" />
        </p-inputgroup>
    </div>
    <button class="validation" type="submit">Soumettre</button>
</form>
