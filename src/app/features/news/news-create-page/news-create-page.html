<form [formGroup]="newsGroup" (ngSubmit)="onSubmit()">
    <div>
        <label for="title">Titre : </label>
        <input type="text" formControlName="title" id="title">
    </div>
        <div>
        <label for="description">Résumé : </label>
        <input type="text" formControlName="description" id="description">
    </div>
        <div>
        <label for="text">Article : </label>
        <input type="text" formControlName="text" id="text">
    </div>
        <div>
        <label for="userID">User ID : </label>
        <input type="number" formControlName="userID" id="userID">
    <div>
        <label for="pictures">Photos : </label>
        <input type="text" formControlName="pictures" id="pictures">
    </div>
    </div>
    <div>
        <label for="tags">Etiquettes : </label>
        <input type="text" formControlName="tags" id="tags">
    </div>
    <button>Soumettre</button>
</form>
